<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDA Form Calibrator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background: white;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .marker {
            position: absolute;
            background: rgba(255, 0, 0, 0.3);
            border: 2px solid red;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: red;
            user-select: none;
            z-index: 10;
        }

        .marker:hover {
            background: rgba(255, 0, 0, 0.5);
            z-index: 20;
        }

        .marker.active {
            background: rgba(0, 255, 0, 0.3);
            border-color: green;
            color: green;
        }

        #controls {
            width: 300px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        h2 {
            margin-top: 0;
        }

        .field-list {
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .field-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        #output {
            margin-top: 20px;
            width: 100%;
            height: 200px;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <canvas id="the-canvas"></canvas>
    </div>

    <div id="controls">
        <h2>🔧 Calibrator</h2>
        <p>Drag the red boxes to align with the form fields.</p>

        <div class="field-list" id="fieldList"></div>

        <button onclick="generateConfig()">Generate Config</button>
        <textarea id="output" readonly placeholder="Config will appear here..."></textarea>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Fields with simulation data
        // Spacing must match server.js: IBAN/Mobile=13.5, Dates=15 or 13.5, Amount=20
        const fields = [
            { id: 'bankName', label: 'Bank Name', x: 216, y: 262, w: 200, h: 20, type: 'text', sample: 'ADCB Bank' },
            { id: 'name', label: 'Account Title', x: 193, y: 282, w: 200, h: 20, type: 'text', sample: 'John Doe' },
            { id: 'type', label: 'Type', x: 248, y: 302, w: 20, h: 20, type: 'text', sample: 'X' },

            // IBAN: 23 chars, spacing 13.5
            { id: 'iban', label: 'IBAN', x: 155, y: 327, w: 350, h: 20, type: 'chars', sample: 'AE070331234567890123456', spacing: 13.5 },

            // Mobile: 10 chars, spacing 13.5
            { id: 'mobile', label: 'Mobile', x: 217, y: 353, w: 150, h: 20, type: 'chars', sample: '0501234567', spacing: 13.5 },

            // Issued: DD MM YYYY (grouped)
            // We simulate the first group (DD) and show others relatively? 
            // Better to just show the first group for alignment, or all if possible.
            // server.js draws them at x, x+60, x+125.
            // Let's just allow aligning the START of the date (DD) for now.
            { id: 'issued', label: 'Issued (DD)', x: 222, y: 393, w: 40, h: 20, type: 'chars', sample: '01', spacing: 15 },

            { id: 'commence', label: 'Commence (DD)', x: 221, y: 415, w: 40, h: 20, type: 'chars', sample: '01', spacing: 13.5 },
            { id: 'expire', label: 'Expire (DD)', x: 220, y: 437, w: 40, h: 20, type: 'chars', sample: '01', spacing: 13.5 },

            { id: 'freq', label: 'Monthly', x: 207, y: 493, w: 20, h: 20, type: 'text', sample: 'X' },

            { id: 'amt1', label: 'Amount 1', x: 198, y: 524, w: 100, h: 20, type: 'chars', sample: '1000', spacing: 20 },
            { id: 'amt2', label: 'Amount 2', x: 202, y: 551, w: 100, h: 20, type: 'chars', sample: '1000', spacing: 20 },
        ];

        let pdfHeight = 0;

        async function loadPDF() {
            try {
                const loadingTask = pdfjsLib.getDocument('/DDA_FORM.pdf');
                const pdf = await loadingTask.promise;
                const page = await pdf.getPage(1);

                const scale = 1.5;
                const viewport = page.getViewport({ scale });
                pdfHeight = viewport.height / scale; // Original PDF height

                const canvas = document.getElementById('the-canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                await page.render(renderContext).promise;

                initMarkers(scale);
            } catch (error) {
                console.error('Error loading PDF:', error);
                alert('Error loading PDF: ' + error.message + '\n\nMake sure DDA_FORM.pdf is in the public folder.');
            }
        }

        function initMarkers(scale) {
            const container = document.getElementById('canvas-container');
            const fieldList = document.getElementById('fieldList');

            fields.forEach(field => {
                if (field.type === 'chars') {
                    // Explode into individual markers
                    const chars = field.sample.split('');
                    chars.forEach((char, i) => {
                        const el = document.createElement('div');
                        el.className = 'marker';
                        el.id = `marker-${field.id}-${i}`;
                        el.textContent = char;
                        el.dataset.parentId = field.id;
                        el.dataset.index = i;

                        // Style for individual char box
                        el.style.width = `${12 * scale}px`; // Approx width of a char box
                        el.style.height = `${field.h * scale}px`;
                        el.style.display = 'flex';
                        el.style.alignItems = 'center';
                        el.style.justifyContent = 'center';
                        el.style.background = 'rgba(0, 255, 0, 0.2)';
                        el.style.border = '1px solid green';
                        el.style.fontSize = `${9 * scale}px`;

                        // Initial Position
                        const startX = field.x * scale;
                        const spacing = field.spacing * scale;
                        el.style.left = `${startX + (i * spacing)}px`;
                        el.style.top = `${field.y * scale}px`;

                        makeDraggable(el, scale, field, i);
                        container.appendChild(el);
                    });

                    // Add summary item to list
                    const item = document.createElement('div');
                    item.className = 'field-item';
                    item.innerHTML = `<span>${field.label} (${chars.length} chars)</span> <span id="coord-${field.id}">Move chars individually</span>`;
                    fieldList.appendChild(item);

                } else {
                    // Standard single box
                    const el = document.createElement('div');
                    el.className = 'marker';
                    el.id = `marker-${field.id}`;
                    el.textContent = field.sample || field.label;
                    el.style.width = `${field.w * scale}px`;
                    el.style.height = `${field.h * scale}px`;
                    el.style.left = `${field.x * scale}px`;
                    el.style.top = `${field.y * scale}px`;

                    makeDraggable(el, scale, field);
                    container.appendChild(el);

                    const item = document.createElement('div');
                    item.className = 'field-item';
                    item.innerHTML = `<span>${field.label}</span> <span id="coord-${field.id}">X:${field.x}, Y:${field.y}</span>`;
                    fieldList.appendChild(item);
                }
            });
        }

        function makeDraggable(el, scale, field, index = null) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            el.addEventListener('mousedown', (e) => {
                isDragging = true;
                el.classList.add('active');
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = parseFloat(el.style.left);
                initialTop = parseFloat(el.style.top);
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                const newLeft = initialLeft + dx;
                const newTop = initialTop + dy;

                el.style.left = `${newLeft}px`;
                el.style.top = `${newTop}px`;

                // Update coordinates display
                const pdfX = Math.round(newLeft / scale);
                const pdfY = Math.round(newTop / scale);

                if (index === null) {
                    field.x = pdfX;
                    field.y = pdfY;
                    document.getElementById(`coord-${field.id}`).textContent = `X:${pdfX}, Y:${pdfY}`;
                } else {
                    // For chars, we don't update the main field object directly here
                    // We'll calculate it in generateConfig
                }
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                el.classList.remove('active');
            });
        }

        function generateConfig() {
            const config = {};

            fields.forEach(field => {
                if (field.type === 'chars') {
                    // Calculate best fit from individual markers
                    const chars = field.sample.split('');
                    let firstX = 0, lastX = 0, avgY = 0;

                    // Get positions of first and last char
                    const firstEl = document.getElementById(`marker-${field.id}-0`);
                    const lastEl = document.getElementById(`marker-${field.id}-${chars.length - 1}`);

                    // Calculate average Y from all chars
                    let totalY = 0;
                    for (let i = 0; i < chars.length; i++) {
                        const el = document.getElementById(`marker-${field.id}-${i}`);
                        totalY += parseFloat(el.style.top);
                    }
                    avgY = totalY / chars.length;

                    // Convert to PDF coords
                    const scale = 1.5; // Hardcoded for now, should match loadPDF
                    const pdfFirstX = Math.round(parseFloat(firstEl.style.left) / scale);
                    const pdfLastX = Math.round(parseFloat(lastEl.style.left) / scale);
                    const pdfY = Math.round(avgY / scale);

                    // Calculate spacing
                    // Distance between first and last char divided by number of gaps
                    const totalDist = pdfLastX - pdfFirstX;
                    const gaps = chars.length - 1;
                    const spacing = Number((totalDist / gaps).toFixed(2));

                    config[field.id] = {
                        x: pdfFirstX,
                        y: pdfY,
                        spacing: spacing
                    };

                } else {
                    config[field.id] = { x: field.x, y: field.y };
                }
            });

            const json = JSON.stringify(config, null, 2);
            document.getElementById('output').value = json;
            console.log(json);
        }

        loadPDF();
    </script>
</body>

</html>
