<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDA Form Auto-Fill</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #444;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input:hover {
            border-color: #b8c5f2;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: #667eea;
            font-size: 14px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📄 DDA Form Auto-Fill</h1>
        <p class="subtitle">Fill in your details to generate your Direct Debit Authorization</p>

        <div id="errorMessage" class="error"></div>

        <form id="ddaForm">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name"
                    autocomplete="name">
            </div>

            <div class="form-group">
                <label for="iban">IBAN *</label>
                <input type="text" id="iban" name="iban" required placeholder="AE070331234567890123456"
                    pattern="[A-Z]{2}[0-9]{2}[A-Z0-9]+"
                    title="Please enter a valid IBAN (e.g., AE070331234567890123456)" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="bankName">Bank Name *</label>
                <input type="text" id="bankName" name="bankName" required placeholder="Enter your bank name"
                    autocomplete="off">
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number *</label>
                <input type="tel" id="mobile" name="mobile" required placeholder="0501234567" pattern="05[0-9]{8}"
                    title="Please enter a valid UAE mobile number (05XXXXXXXX)" maxlength="10" autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="commenceDate">Commences On *</label>
                <input type="date" id="commenceDate" name="commenceDate" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="expireDate">Expires On *</label>
                <input type="date" id="expireDate" name="expireDate" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="amount">Amount (AED) *</label>
                <input type="number" id="amount" name="amount" required min="0.01" step="0.01" placeholder="0.00"
                    autocomplete="off">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                Generate PDF
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            Generating your PDF...
        </div>
    </div>

    <script>
        const form = document.getElementById('ddaForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Hide error message
            errorMessage.classList.remove('show');
            
            // Get form data
            const formData = {
                name: document.getElementById('name').value.trim(),
                iban: document.getElementById('iban').value.trim().toUpperCase(),
                bankName: document.getElementById('bankName').value.trim(),
                mobile: document.getElementById('mobile').value.trim(),
                commenceDate: formatDateToDDMMYYYY(document.getElementById('commenceDate').value),
                expireDate: formatDateToDDMMYYYY(document.getElementById('expireDate').value),
                amount: document.getElementById('amount').value
            };

            // Helper function to convert YYYY-MM-DD to DD.MM.YYYY
            function formatDateToDDMMYYYY(dateStr) {
                if (!dateStr) return '';
                const parts = dateStr.split('-');
                return `${parts[2]}.${parts[1]}.${parts[0]}`;
            }

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Generating...';
            loading.classList.add('show');

            try {
                const response = await fetch('/fill', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to generate PDF');
                }

                // Get the PDF blob
                const blob = await response.blob();
                
                // Create download link
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `DDA_${formData.name.replace(/\s/g, '_')}_${Date.now()}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                // Reset form
                form.reset();
                
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.add('show');
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                submitBtn.textContent = 'Generate PDF';
                loading.classList.remove('show');
            }
        });

        // Auto-format IBAN as user types
        document.getElementById('iban').addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });
    </script>
</body>

</html>
